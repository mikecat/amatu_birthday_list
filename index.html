<!DOCTYPE html>
<html lang="ja">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>あたり ～あまつ誕生日リスト～</title>
		<link rel="icon" href="atari.ico" sizes="16x16">
		<link rel="stylesheet" href="index.css">
		<script src="abl.js"></script>
	</head>
	<body>
		<h1>あまつ誕生日リスト</h1>
		<p id="versionWrapper">
			対応バージョン：<span id="versionArea"></span>
		</p>
		<p id="todayWrapper">
			今日：<span id="todayArea"></span>
		</p>
		<table>
			<thead>
				<tr>
					<th>アイドル</th>
					<th colspan="4">誕生日</th>
					<th>あと</th>
				</tr>
			</thead>
			<tbody id="birthdayTbody">
			</tbody>
		</table>
		<p>
			<a id="repoLink" href="https://github.com/mikecat/amatu_birthday_list">GitHub リポジトリ</a>
		</p>
	</body>
</html>
